[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thingstodo"
version = "0.1.0"
description = "Search local events in plain words: concerts, pop-ups, markets, classes. Client for the Things To Do API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["events", "local events", "things to do", "concerts", "api", "mcp", "ai agents"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Internet :: WWW/HTTP"]
dependencies = []

[project.urls]
Homepage = "https://thingstodoapi.com"
Documentation = "https://thingstodoapi.com/docs/"
Repository = "https://github.com/thingstodoapi/thingstodo"
